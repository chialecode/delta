# cargo-packager configuration for DELTA Windows desktop distribution (`S-23`, `M2-K04`)
# Supports both `release` (`delta`) and `dev` (`delta-dev`) per-user channels without UAC elevation.

name = "delta"
product-name = "delta"
version = "0.1.0"
identifier = "io.delta.workbench"
description = "DELTA local-first investment ledger, review workbench, and evidence-based AI assistant"
authors = ["DELTA Contributors"]
license-file = "LICENSE"
out-dir = "target/packager"
formats = ["nsis"]

[[binaries]]
path = "delta.exe"
main = true

[[binaries]]
path = "delta-cli.exe"
main = false

resources = [
  "LICENSE",
  "THIRD-PARTY-NOTICES.txt",
]

[windows]
allow-downgrades = true

[windows.nsis]
install-mode = "currentUser"
display-language-selector = false
languages = ["SimpChinese", "English"]
