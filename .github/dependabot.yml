version: 2
# Version updates wait 7 days after a release (cooldown), the same age as
# `python scripts/deps.py`. Their PRs are handled in the weekly maintenance;
# risk tiers are in docs/dev-rules/quality-gates.md#dependencies.
# Security updates are not delayed by the cooldown.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      compatible:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(toolchain)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
