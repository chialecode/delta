name: 缺陷
description: 行为不对、崩溃或数据问题
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际看到的现象；不要贴真实账户明细、交易流水、密钥或令牌。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎样复现
      description: 步骤与预期结果。
  - type: input
    id: version
    attributes:
      label: 版本与通道
      description: “设置 › 关于”里的版本号与通道（delta / delta-dev）。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。发出前去掉账户、金额等私人内容。
